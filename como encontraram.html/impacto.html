    <h1>Impacto</h1>

    <p>
        O acidente com o Césio-137 causou a contaminação de centenas de pessoas e a morte de quatro delas. 
        Muitas casas precisaram ser demolidas e toneladas de objetos contaminados foram isolados como lixo radioativo. 
        É considerado o maior acidente radiológico fora de uma usina nuclear no mundo.
